# Each question: q, a (answers; the first is correct, the quiz shuffles them), c (index of the correct answer), why.
- {q: "What is the normal resting heart rate range for most adults?", a: ["60 to 100 beats per minute", "40 to 60 beats per minute", "100 to 140 beats per minute", "120 to 160 beats per minute"], c: 0, why: "A resting rate of 60 to 100 bpm is normal for adults. Well-trained athletes are often lower."}
- {q: "Which organ makes insulin?", a: ["Pancreas", "Liver", "Kidney", "Thyroid"], c: 0, why: "Beta cells in the pancreatic islets produce insulin, which lets cells take up glucose."}
- {q: "Which red-cell blood type is the universal donor?", a: ["O negative", "AB positive", "A negative", "B positive"], c: 0, why: "O negative red cells carry no A, B or RhD antigens, so they can be given in emergencies before the patient's type is known."}
- {q: "Which plasma type is the universal plasma donor?", a: ["AB", "O", "A", "B"], c: 0, why: "AB plasma contains no anti-A or anti-B antibodies, the reverse of red cells."}
- {q: "Which vitamin does the skin make when exposed to sunlight?", a: ["Vitamin D", "Vitamin C", "Vitamin B12", "Vitamin K"], c: 0, why: "UVB light converts a cholesterol precursor in the skin into vitamin D3."}
- {q: "An adult BMI of 27 falls into which category?", a: ["Overweight", "Healthy weight", "Obesity class 1", "Underweight"], c: 0, why: "BMI 25 to 29.9 is overweight; 30 and above is obesity."}
- {q: "A hemoglobin A1C test reflects average blood glucose over roughly how long?", a: ["2 to 3 months", "24 hours", "1 week", "1 year"], c: 0, why: "Red blood cells live about 120 days, so A1C reflects the past 2 to 3 months."}
- {q: "What is the largest organ of the human body?", a: ["Skin", "Liver", "Brain", "Lungs"], c: 0, why: "Skin covers about 1.5 to 2 square metres in adults and is the largest organ by area and weight."}
- {q: "How many bones does a typical adult skeleton have?", a: ["206", "186", "226", "300"], c: 0, why: "Babies are born with around 270 bony parts, many of which fuse into 206 by adulthood."}
- {q: "What chest compression rate is recommended for adult CPR?", a: ["100 to 120 per minute", "60 to 80 per minute", "140 to 160 per minute", "As fast as possible"], c: 0, why: "Guidelines advise 100 to 120 compressions per minute, about the tempo of the song Stayin' Alive."}
- {q: "How deep should adult CPR compressions be?", a: ["At least 5 cm (2 in) but no more than 6 cm (2.4 in)", "About 1 cm (0.5 in)", "About 2.5 cm (1 in)", "About 10 cm (4 in)"], c: 0, why: "Push hard and fast: at least 5 cm, allowing full chest recoil between compressions."}
- {q: "Under the 2017 ACC/AHA guideline, normal blood pressure is:", a: ["Below 120/80 mmHg", "Below 140/90 mmHg", "Below 130/85 mmHg", "Below 150/95 mmHg"], c: 0, why: "120 to 129 systolic with diastolic below 80 is 'elevated'; 130/80 and above is hypertension."}
- {q: "Tall, peaked T waves on an ECG most suggest which imbalance?", a: ["High potassium", "Low potassium", "High sodium", "Low calcium"], c: 0, why: "Hyperkalemia classically causes peaked T waves; severe cases can progress to dangerous arrhythmias."}
- {q: "What is the usual adult reference range for serum potassium?", a: ["3.5 to 5.0 mmol/L", "135 to 145 mmol/L", "1.5 to 2.5 mmol/L", "8.5 to 10.5 mmol/L"], c: 0, why: "135 to 145 is sodium; 8.5 to 10.5 mg/dL is calcium."}
- {q: "Which heart chamber pumps oxygen-rich blood out to the body?", a: ["Left ventricle", "Right ventricle", "Right atrium", "Left atrium"], c: 0, why: "The left ventricle has the thickest wall because it pumps into the high-pressure systemic circulation."}
- {q: "In the stroke warning sign acronym FAST, what does the T stand for?", a: ["Time to call emergency services", "Temperature", "Tongue", "Tingling"], c: 0, why: "Face drooping, Arm weakness, Speech difficulty, Time to call. Fast treatment saves brain tissue."}
- {q: "Antibiotics work against which kind of infection?", a: ["Bacterial", "Viral", "Both bacterial and viral", "Allergic"], c: 0, why: "Antibiotics don't treat colds or flu, which are viral. Unneeded use drives antibiotic resistance."}
- {q: "The prefix 'brady-' means:", a: ["Slow", "Fast", "Large", "Painful"], c: 0, why: "Bradycardia is a slow heart rate; tachycardia is a fast one."}
- {q: "The suffix '-itis' means:", a: ["Inflammation", "Removal", "Enlargement", "Disease of"], c: 0, why: "Appendicitis is inflammation of the appendix; '-ectomy' means removal."}
- {q: "The root 'hepat/o' refers to which organ?", a: ["Liver", "Heart", "Kidney", "Stomach"], c: 0, why: "Hepatitis is inflammation of the liver. 'Cardi/o' is heart, 'nephr/o' is kidney, 'gastr/o' is stomach."}
- {q: "What is a normal resting respiratory rate for adults?", a: ["12 to 20 breaths per minute", "4 to 8 breaths per minute", "25 to 35 breaths per minute", "40 to 60 breaths per minute"], c: 0, why: "A rising respiratory rate is often one of the earliest signs that a patient is getting sicker."}
- {q: "Which number best describes overall kidney filtering function?", a: ["eGFR", "ALT", "TSH", "INR"], c: 0, why: "eGFR estimates glomerular filtration rate. ALT is a liver enzyme, TSH a thyroid test and INR a clotting test."}
- {q: "A normal oxygen saturation (SpO2) for a healthy adult at sea level is about:", a: ["95 to 100%", "80 to 85%", "70 to 75%", "88 to 90%"], c: 0, why: "Targets can be lower for some people with chronic lung disease, as set by their care team."}
- {q: "A Glasgow Coma Scale score of 8 or less indicates:", a: ["Severe brain injury", "Mild brain injury", "Normal consciousness", "Moderate brain injury"], c: 0, why: "13 to 15 is mild, 9 to 12 moderate and 3 to 8 severe."}
- {q: "Which of these vaccine-preventable diseases is caused by a virus?", a: ["Measles", "Tetanus", "Diphtheria", "Pertussis (whooping cough)"], c: 0, why: "Tetanus, diphtheria and pertussis are bacterial; measles is caused by a highly contagious virus."}
- {q: "On a medical order, 'NPO' means:", a: ["Nothing by mouth", "No pain observed", "Normal pressure output", "Not previously ordered"], c: 0, why: "From the Latin nil per os. It is common before surgery and some tests."}
- {q: "Which part of the brain is chiefly responsible for balance and coordination?", a: ["Cerebellum", "Frontal lobe", "Medulla", "Hypothalamus"], c: 0, why: "Cerebellar damage causes unsteady gait and poorly coordinated movements."}
- {q: "Medicines whose names end in '-pril' (such as lisinopril) belong to which class?", a: ["ACE inhibitors", "Beta-blockers", "Statins", "Proton pump inhibitors"], c: 0, why: "ACE inhibitors lower blood pressure; a dry cough is a well-known side effect."}
- {q: "Medicines ending in '-olol' (such as metoprolol) are usually:", a: ["Beta-blockers", "Antibiotics", "Antihistamines", "Diuretics"], c: 0, why: "Beta-blockers slow the heart rate and lower blood pressure."}
- {q: "Statins mainly lower which blood fat?", a: ["LDL cholesterol", "HDL cholesterol", "Vitamin D", "Albumin"], c: 0, why: "Statins block HMG-CoA reductase, reducing LDL ('bad') cholesterol and cardiovascular events."}
- {q: "Which is a common early sign of low blood sugar?", a: ["Shakiness and sweating", "Slow heart rate", "Increased thirst", "Itchy skin"], c: 0, why: "Hypoglycemia triggers adrenaline: shakiness, sweating, hunger and a fast heartbeat. Confusion follows if untreated."}
- {q: "What is the main job of red blood cells?", a: ["Carrying oxygen", "Fighting infection", "Forming clots", "Making antibodies"], c: 0, why: "Hemoglobin inside red cells binds oxygen in the lungs and releases it in tissues."}
- {q: "How much moderate-intensity activity should adults aim for each week?", a: ["At least 150 minutes", "At least 30 minutes", "At least 60 minutes", "At least 600 minutes"], c: 0, why: "Or 75 minutes of vigorous activity, plus muscle-strengthening on 2 or more days."}
- {q: "How long does the CDC recommend scrubbing hands with soap?", a: ["At least 20 seconds", "5 seconds", "2 minutes", "1 second"], c: 0, why: "About the time it takes to hum 'Happy Birthday' twice."}
- {q: "How much sleep do adults need per night, at minimum?", a: ["7 hours", "5 hours", "4 hours", "10 hours"], c: 0, why: "Regularly sleeping less than 7 hours is linked to weight gain, high blood pressure and depression."}
- {q: "On a prescription, 'PRN' means:", a: ["As needed", "Every morning", "By mouth", "Twice daily"], c: 0, why: "From the Latin pro re nata. 'PO' means by mouth and 'BID' twice daily."}
- {q: "Taking folic acid before and in early pregnancy lowers the risk of:", a: ["Neural tube defects", "Gestational diabetes", "Preeclampsia", "Morning sickness"], c: 0, why: "Folic acid reduces the risk of spina bifida and anencephaly; the neural tube closes in the first month."}
- {q: "Which eGFR range is CKD stage G3a?", a: ["45 to 59", "60 to 89", "30 to 44", "15 to 29"], c: 0, why: "G3a is 45 to 59 and G3b is 30 to 44 mL/min/1.73 m²."}
- {q: "Medicines ending in '-gliflozin' (such as empagliflozin) work by:", a: ["Making the kidneys pass more glucose in urine", "Stimulating insulin release from the pancreas", "Blocking stomach acid", "Slowing the heart rate"], c: 0, why: "SGLT2 inhibitors also protect the heart and kidneys in many patients."}
- {q: "Which joint disease is caused by wear of cartilage over time?", a: ["Osteoarthritis", "Rheumatoid arthritis", "Gout", "Lupus"], c: 0, why: "Rheumatoid arthritis and lupus are autoimmune; gout is caused by uric acid crystals."}
